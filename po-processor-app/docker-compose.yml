services:
  postgres:
    image: postgres:16-alpine
    container_name: po-processor-db
    restart: always
    environment:
      POSTGRES_DB: po_processor
      POSTGRES_USER: po_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po_user -d po_processor"]
      interval: 10s
      timeout: 5s
      retries: 5

  po-processor:
    build: .
    container_name: po-processor-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://po_user:${POSTGRES_PASSWORD}@postgres:5432/po_processor
    volumes:
      - gmail_tokens:/data/gmail
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  gmail_tokens:
    driver: local
