services:
  postgres:
    image: postgres:16-alpine
    container_name: po-processor-db
    restart: always
    environment:
      POSTGRES_DB: po_processor
      POSTGRES_USER: po_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po_user -d po_processor"]
      interval: 10s
      timeout: 5s
      retries: 5

  po-processor:
    image: ghcr.io/zrfish98/tnt-po-processor:latest
    container_name: po-processor-app
    restart: always
    networks:
      - n8n_default
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.po-processor.rule=Host(`internal.atiara.cloud`)
      - traefik.http.routers.po-processor.tls=true
      - traefik.http.routers.po-processor.entrypoints=web,websecure
      - traefik.http.routers.po-processor.tls.certresolver=mytlschallenge
      - traefik.http.services.po-processor.loadbalancer.server.port=8501
      - traefik.http.middlewares.po-processor.headers.SSLRedirect=true
      - traefik.http.middlewares.po-processor.headers.STSSeconds=315360000
      - traefik.http.middlewares.po-processor.headers.browserXSSFilter=true
      - traefik.http.middlewares.po-processor.headers.contentTypeNosniff=true
      - traefik.http.middlewares.po-processor.headers.forceSTSHeader=true
      - traefik.http.middlewares.po-processor.headers.SSLHost=atiara.cloud
      - traefik.http.middlewares.po-processor.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.po-processor.headers.STSPreload=true
      - traefik.http.routers.po-processor.middlewares=po-processor@docker
    environment:
      - ODOO_URL=https://atiara-trading-inc.odoo.com
      - ODOO_DB=atiara-trading-inc
      - ODOO_USERNAME=official@atiara.ca
      - ODOO_API_KEY=${ODOO_API_KEY}
      - DATABASE_URL=postgresql://po_user:${POSTGRES_PASSWORD}@po-processor-db:5432/po_processor
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_TOKEN_PATH=/data/gmail/token.json
      - GMAIL_CREDENTIALS_PATH=/data/gmail/credentials.json
      - GMAIL_POLL_INTERVAL_SECONDS=300
      - APP_BASE_URL=https://internal.atiara.cloud
      - GOOGLE_APPLICATION_CREDENTIALS_JSON=${GOOGLE_APPLICATION_CREDENTIALS_JSON}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - gmail_tokens:/data/gmail
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  n8n_default:
    external: true

volumes:
  postgres_data:
    driver: local
  gmail_tokens:
    driver: local
